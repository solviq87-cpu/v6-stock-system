<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>天枢智策 · 模型与开源功能资料库</title><link rel="stylesheet" href="/assets/model-library.css?v=20261114context1"><script defer src="/assets/public-library-context.js?v=20261114context1"></script><script defer src="/assets/model-library.js?v=20261114context1"></script></head>
<body><main id="modelLibrary"><nav aria-label="返回研究工作台"><a href="/research.html">← 返回研究工作台</a></nav>
<header class="page-heading"><h1>模型与开源功能资料库</h1><p>按任务查找值得借鉴的做法，选择最多3项对照。</p><p class="muted">公开来源与设计对照；模型实测、运行条件和采用状态分别展示。</p></header>
<section class="library-overview" aria-labelledby="libraryOverviewHeading"><h2 id="libraryOverviewHeading">公开资料总览</h2><p class="muted">全目录数量；点击卡片查看对应资料。</p><div class="library-summary-grid">
<button class="library-summary-card" type="button" data-library-summary="all" aria-pressed="false" disabled><span>全部公开资料</span><strong data-summary-count>—</strong></button>
<button class="library-summary-card" type="button" data-library-summary="implemented" aria-pressed="false" disabled><span>设计已落实</span><strong data-summary-count>—</strong></button>
<button class="library-summary-card" type="button" data-library-summary="candidate" aria-pressed="false" disabled><span>待条件实测</span><strong data-summary-count>—</strong></button>
<button class="library-summary-card" type="button" data-library-summary="reference-only" aria-pressed="false" disabled><span>仅参考</span><strong data-summary-count>—</strong></button>
</div></section>
<div class="library-layout"><aside class="filter-panel"><form id="libraryFilters" aria-label="筛选公开资料" autocomplete="off">
<label for="librarySearch">搜索名称、功能或许可</label><input id="librarySearch" type="search" maxlength="160" placeholder="例如：中文、量化、来源引用">
<label for="libraryCategory">任务类别</label><select id="libraryCategory"><option value="">全部类别</option></select>
<label for="libraryAdoption">采用状态</label><select id="libraryAdoption"><option value="">全部状态</option><option value="implemented">设计已落实</option><option value="candidate">待条件实测</option><option value="reference-only">仅参考</option></select>
<button id="libraryReset" type="button">清除筛选</button></form><p id="libraryStatus" role="status" aria-live="polite">正在读取公开目录…</p><button id="libraryRetry" type="button" hidden>重试读取目录</button><p id="libraryCount" class="muted" aria-live="polite"></p></aside>
<div class="library-content"><section class="comparison-panel" aria-labelledby="compareHeading"><div class="section-heading"><h2 id="compareHeading">已选对照 <span id="compareCount">0 / 3</span></h2><div class="actions"><a id="libraryShare" class="library-share-link" title="可复制链接地址；仅包含公开类别、采用状态与资料编号，不含搜索词" hidden>公开视图链接</a><button id="libraryExport" type="button" disabled>下载对照JSON</button><button id="libraryClear" type="button" class="secondary" disabled>清除选择</button></div></div><p id="compareNotice" class="muted">选择资料后查看来源、许可、运行方式与借鉴内容。</p><div id="compareGrid" class="compare-grid"></div></section>
<section aria-labelledby="catalogHeading"><h2 id="catalogHeading">公开资料</h2><p id="libraryEmpty" hidden>没有符合筛选条件的资料，可清除筛选后重试。</p><div id="libraryCards" class="catalog-grid"></div></section></div></div>
<noscript><p>请启用JavaScript读取公开资料目录。</p></noscript></main></body></html>
