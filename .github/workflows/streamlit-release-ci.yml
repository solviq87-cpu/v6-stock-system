name: Readonly Streamlit Release CI
on:
  push:
    branches: [streamlit-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamlit-release-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-deploy-smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify required application files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f .streamlit/config.toml
          test ! -e V6_BO/server.js
          test ! -e .env
          test ! -e access.json
      - name: Install actual deployment dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=7,<10'
      - name: Check Streamlit and AKShare imports
        run: |
          python - <<'PY'
          import sys
          import streamlit
          import akshare
          import market_data
          import analysis_core
          print("PYTHON:", sys.version)
          print("STREAMLIT:", streamlit.__version__)
          print("AKSHARE:", akshare.__version__)
          PY
      - name: Compile and run market/backtest tests
        run: |
          python -m compileall -q app.py market_data.py analysis_core.py tests
          python -m pytest -q tests
