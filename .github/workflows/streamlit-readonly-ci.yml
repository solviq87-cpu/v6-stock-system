name: Streamlit Readonly CI
on:
  push:
    branches: [dev]
    paths:
      - 'streamlit_readonly/**'
      - '.github/workflows/streamlit-readonly-ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'streamlit_readonly/**'
      - '.github/workflows/streamlit-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated logic dependencies
        run: |
          python -m pip install 'pytest>=7,<10'
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install 'pandas>=1.5,<2.1' 'numpy>=1.23,<2.0'
          else
            python -m pip install 'pandas>=2.2,<3.0' 'numpy>=1.26,<3.0'
          fi
      - name: Compile optional adapter and run regression tests
        run: |
          python -m compileall -q streamlit_readonly
          python -m pytest -q streamlit_readonly/tests
