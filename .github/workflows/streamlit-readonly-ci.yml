name: Streamlit Readonly CI
on:
  push:
    branches: [dev]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.streamlit/config.toml'
      - 'zbpack.json'
      - 'streamlit_readonly/**'
      - '.github/workflows/streamlit-readonly-ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.streamlit/config.toml'
      - 'zbpack.json'
      - 'streamlit_readonly/**'
      - '.github/workflows/streamlit-readonly-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pure logic dependencies
        run: |
          python -m pip install 'pytest>=7,<10'
          if [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install 'pandas>=1.5,<2.1' 'numpy>=1.23,<2.0'
          else
            python -m pip install 'pandas>=2.2,<3.0' 'numpy>=1.26,<3.0'
          fi
      - name: Compile and run isolated tests
        run: |
          python -m compileall -q app.py streamlit_readonly
          python -m pytest -q streamlit_readonly/tests
