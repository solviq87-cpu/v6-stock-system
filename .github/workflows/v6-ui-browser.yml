# Actual headless Chrome geometry on isolated fixture pages. Not a production deployment.
# This required job runs for every development push and matching PR. Backend
# contracts can change both clients; workflow path filters would leave required
# checks pending forever on documentation/backend-only PRs.
name: V6 UI Browser Geometry
on:
  # Every nonarchive code push receives a real browser check.
  push:
    branches: ['**', '!archive/**']
  pull_request:
    branches: [main, dev, "feat/**", "chore/**", "fix/**", "audit/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: V6_BO
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Find pre-installed Chromium/Google Chrome
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME" || { echo 'No Chrome on runner; cannot claim layout is verified'; exit 1; }
          "$CHROME" --version
          echo "binary=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Install free Chinese fonts for accurate visual review
        shell: bash
        run: |
          set -euo pipefail
          # Runner images are ephemeral; Ubuntu package mirrors can be unreachable.
          # Use a version-pinned, content-hash-verified OFL Google Fonts file
          # as a bounded fallback. It is installed in the test runner only.
          # No unbounded apt-get update and no font is committed to this repo.
          has_chinese_font() {
            # Ubuntu apt installs "Noto Sans CJK SC" while the pinned,
            # region-specific OFL font installs "Noto Sans SC".
            { fc-match -f '%{family}\n' 'Noto Sans CJK SC';
              fc-match -f '%{family}\n' 'Noto Sans SC'; } |
              grep -Eq 'Noto Sans (CJK|SC)'
          }
          if ! has_chinese_font; then
            mkdir -p "$HOME/.local/share/fonts/v6-qa"
            font_tmp="$RUNNER_TEMP/NotoSansSC-wght.ttf"
            font_url='https://raw.githubusercontent.com/google/fonts/2894aab31764f10f29c421bdfd2340d3b382d384/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
            if timeout --signal=TERM --kill-after=5s 85s curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 80 "$font_url" -o "$font_tmp" && \
                test "$(git hash-object "$font_tmp")" = 'fb0637bafbcd804fe32152370a1225990745b4bc'; then
              install -m 644 "$font_tmp" "$HOME/.local/share/fonts/v6-qa/NotoSansSC-wght.ttf"
              echo 'CJK_FONT_SOURCE=google-fonts-pinned-git-blob'
            else
              echo 'Pinned Google Fonts unavailable or blob hash mismatch; trying bounded apt fallback.'
              rm -f "$font_tmp"
              timeout --signal=TERM --kill-after=5s 45s sudo env DEBIAN_FRONTEND=noninteractive \
                apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 \
                -o Acquire::https::Timeout=15 install -y -qq fonts-noto-cjk >/dev/null || {
                  echo 'FONT_SETUP_UNAVAILABLE: both verified font sources failed; browser test NOT executed.' >&2
                  exit 1
                }
              echo 'CJK_FONT_SOURCE=bounded-ubuntu-package'
            fi
          else
            echo 'CJK_FONT_SOURCE=preinstalled'
          fi
          timeout --signal=TERM --kill-after=5s 30s fc-cache -f >/dev/null || {
            echo 'FONT_CACHE_UNAVAILABLE: font cache rebuild timed out; do not certify screenshots.' >&2
            exit 1
          }
          has_chinese_font || {
            echo 'FONT_MISSING: No verified Noto Sans Chinese font; visual geometry NOT certified.' >&2
            exit 1
          }
      - name: Install pinned Playwright driver (no browser download, no app dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/v6-ui-driver"
          npm install --prefix "$RUNNER_TEMP/v6-ui-driver" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.57.0
      - name: Reject a browser test clock that moves backward
        env:
          NODE_PATH: ${{ runner.temp }}/v6-ui-driver/node_modules
        run: node scripts/verify-browser-clock.js
      - name: Check actual DOM rectangles and visual screenshots on 9 CSS viewports
        env:
          NODE_PATH: ${{ runner.temp }}/v6-ui-driver/node_modules
          V6_UI_BROWSER: ${{ steps.browser.outputs.binary }}
          V6_UI_QA_DIR: ${{ runner.temp }}/v6-ui-report
          FAYO_EXECUTION_QA_DIR: ${{ runner.temp }}/v6-ui-report/execution
          FAYO_RISK_QA_DIR: ${{ runner.temp }}/v6-ui-report/risk
          FAYO_ADVANCED_QA_DIR: ${{ runner.temp }}/v6-ui-report/advanced-safety
          FAYO_COMMAND_QA_DIR: ${{ runner.temp }}/v6-ui-report/command-evidence
          FAYO_EVOLUTION_QA_DIR: ${{ runner.temp }}/v6-ui-report/evolution
          V6_UI_SCREENSHOTS: '1'
        run: |
          set -euo pipefail
          node scripts/fayo-browser-check.js
          node scripts/fayo-command-evidence-browser-check.js
          node scripts/fayo-replay-boundaries-browser-check.js
          node scripts/fayo-research-discipline-browser-check.js
          node scripts/fayo-decision-browser-check.js
          node scripts/fayo-execution-browser-check.js
          node scripts/fayo-risk-browser-check.js
          node scripts/fayo-advanced-safety-browser-check.js
          node scripts/fayo-intelligence-browser-check.js
          node scripts/fayo-deep-research-browser-check.js
          node scripts/fayo-evolution-browser-check.js
          node scripts/fayo-operations-browser-check.js
          node scripts/fayo-source-review-browser-check.js
          node scripts/fayo-manual-loop-browser-check.js
          node scripts/fayo-kline-learning-browser-check.js
          node scripts/fayo-close-freeze-browser-check.js
          node scripts/ui-unified-workspace-browser-check.js
          node scripts/ui-original-workspace-browser-check.js
          node scripts/ui-mobile-roles-browser-check.js
          node scripts/ui-cache-upgrade-browser-check.js
          node scripts/ui-reference-browser-check.js
          node scripts/ui-picks-three-k-browser-check.js
          node scripts/ui-stream-recovery-browser-check.js
          node scripts/ui-stock-list-import-browser-check.js
          node scripts/ui-research-decision-review-check.js
          node scripts/ui-research-workspace-check.js
          node scripts/ui-model-forecast-check.js
          node scripts/ui-model-library-check.js
          node scripts/ui-research-summary-cards-check.js
          node scripts/ui-research-selection-check.js
          node scripts/ui-research-navigation-check.js
          node scripts/ui-research-tab-race-check.js
          node scripts/ui-research-recovery-check.js
          node scripts/ui-research-context-check.js
          node scripts/ui-market-linkage-check.js
          node scripts/ui-learning-workbench-check.js
          node scripts/ui-model-library-context-check.js
      - name: Verify research36 evidence import, configuration, privacy and responsive layout
        env:
          NODE_PATH: ${{ runner.temp }}/v6-ui-driver/node_modules
          V6_CHROMIUM_PATH: ${{ steps.browser.outputs.binary }}
          V6_UI_SCREENSHOT_DIR: ${{ runner.temp }}/v6-ui-report/research36
        run: node scripts/ui-research36-check.js
      - name: Verify the WorkBuddy static artifact preserves current page interactions
        env:
          NODE_PATH: ${{ runner.temp }}/v6-ui-driver/node_modules
          CHROMIUM_PATH: ${{ steps.browser.outputs.binary }}
          V6_UI_BROWSER: ${{ steps.browser.outputs.binary }}
          V6_UI_QA_DIR: ${{ runner.temp }}/v6-ui-report
        run: node --test scripts/workbuddy-static-browser-check.js scripts/workbuddy-module-browser-check.js scripts/workbuddy-news-browser-check.js
      - name: Save temporary fixture screenshots and geometry for reviewers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v6-isolated-ui-geometry-${{ github.run_number }}
          path: ${{ runner.temp }}/v6-ui-report
          if-no-files-found: warn
          retention-days: 7
      - name: State QA boundaries
        if: always()
        run: |
          {
            echo '## V6 UI 浏览器几何验收'
            echo ''
            echo 'Chrome 真实排版 + 隔离本地测试数据；320/375/390/393/430/1024 手机及 1366/1536/1920 电脑 CSS 视口。'
            echo '新FAYO独立应用：五空间导航、机会看板、股票抽屉、登录/撤权、休市空响应保留、19个原生业务分区、确认计划冻结；320/390/768/1366/1920实际排版。'
            echo '随后运行保留旧页面的历史回归（含原七项底栏）；历史通过不作为新产品认证。截图见本次 Artifacts（7天保留）。'
            echo ''
            echo '**未做**：线上 WorkBuddy 实际部署，iOS Safari/Android 真机触摸体验，股票报价真实性、飞书送达，用户对新粉紫设计的视觉确认。'
          } >> "$GITHUB_STEP_SUMMARY"
