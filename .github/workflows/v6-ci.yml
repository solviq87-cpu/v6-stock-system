name: V6 CI
on:
  # Run full checks for each pushed development-branch head, not just dev/main.
  # Historical binary-only archive branches have no runnable V6 source tree.
  push:
    branches: ['**', '!archive/**']
  pull_request:
    # Stacked correctness PRs must run the same gates before reaching dev.
    branches: [main, dev, "feat/**", "chore/**", "fix/**"]
  workflow_dispatch:

jobs:
  verify-cloud-full-server:
    name: cloud-records-real-login
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full V6 login and private CAS HTTP without real accounts or network
        run: node --test V6_BO/tests/cloud-records-server-integration.test.js
  verify-cloud-http:
    name: cloud-records-http-auth
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real localhost HTTP boundaries with synthetic tokens only
        run: |
          node --check V6_BO/src/server/cloud-records-http.js
          node --test V6_BO/tests/cloud-records-http.test.js
  verify-market-source-integrity:
    name: history-source-lineage-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source family, strict historical import and BaoStock unit safety
        run: |
          node --check V6_BO/src/core/market-source-lineage.js
          node --check V6_BO/src/core/market-feed-consensus.js
          node --check V6_BO/src/core/market-data-center.js
          node --check V6_BO/src/core/baostock-eod-research-bridge.js
          node --test V6_BO/tests/market-feed-consensus.test.js V6_BO/tests/baostock-eod-research-bridge.test.js V6_BO/tests/market-data-center-e2e.test.js V6_BO/tests/eastmoney-historical-feed.test.js
  verify-cloud-cas:
    name: cloud-records-cas
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check append-only ledger, CAS conflicts, idempotency and child process races
        run: |
          node --check V6_BO/src/core/cloud-records-cas-store.js
          node --test V6_BO/tests/cloud-records-cas-store.test.js
  # Every push/PR gets a separate visible safety check, not an empty status.
  verify-cloud-ledger:
    name: cloud-ledger-failclosed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Missing or unreadable cloud ledger must never be overwritten
        run: node --test V6_BO/tests/workbuddy-ledger-failclosed.test.js
  verify-workbuddy-readonly-audit:
    name: workbuddy-readonly-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private credentials never escape and only GET requests are allowed
        run: node --test V6_BO/tests/workbuddy-readonly-audit.test.js
  verify-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: V6_WEB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned web build and test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify causal browser research
        id: webcheck
        run: |
          npm run build
          npm test
          git diff --exit-code -- dist
      - name: Record web CI evidence in workflow summary
        if: always()
        env:
          WEB_RESULT: ${{ steps.webcheck.outcome }}
        run: |
          {
            echo "## V6 网页构建与测试"
            echo ""
            echo "| 门禁 | 结果 |"
            echo "| --- | --- |"
            echo "| 构建、浏览器测试及 dist 一致性 | $WEB_RESULT |"
            echo ""
            echo "提交：${GITHUB_SHA}"
            echo ""
            echo "仅为代码测试，不表示网页已部署或接通实时行情。"
          } >> "$GITHUB_STEP_SUMMARY"
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: V6_BO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate workflow syntax and Actions context availability
        run: bash ../scripts/check-github-workflows.sh
      - name: Block OpenAI and ChatGPT runtime API dependencies
        id: noopenai
        working-directory: .
        run: python scripts/audit-no-openai-runtime.py
      - name: Verify archived source intake guards (offline fixtures only)
        id: archivecheck
        working-directory: .
        run: python -m unittest discover -s tests -p 'test_audit_*_archive.py' -v
      - name: Install Python ML test dependencies
        run: python -m pip install -r tools/requirements-models-optional.txt
      - name: Verify Windows local-host bundle uses exact Git source and excludes runtime state
        working-directory: .
        run: python -m unittest discover -s tests -p 'test_windows_host_bundle.py' -v
      - name: Verify complete engineering archive integrity, reproducibility and privacy guards
        run: python -m unittest discover -s tests -p 'test_complete_engineering_bundle.py' -v
      - name: Build and verify the full real source tree without deploying
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/v6-complete-source-ci-$GITHUB_SHA.zip"
          python scripts/build-complete-engineering-bundle.py build --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$target"
          python scripts/build-complete-engineering-bundle.py verify --repo "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA" --output "$target"
          rm -f "$target"
      - name: Verify source and run tests
        id: sourcecheck
        env:
          V6_MODEL_PYTHON: python
          V6_TEST_CONCURRENCY: '2'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          test -f package.json || { echo 'V6_BO/package.json missing'; exit 1; }
          npm run check
          npm test
      - name: Eight-point integration regression (offline evidence only)
        id: eightpointcheck
        run: node --test tests/eight-point-flow.test.js tests/research-watch-journal.test.js tests/research-explanation-ui.test.js tests/manual-holding-risk-watch.test.js tests/research-rule-weight-review.test.js
      - name: Four-yellow remediation regression (network is mocked, never deliver externally)
        id: yellowfourcheck
        run: npm run test:yellow-four
      - name: Audit fourteen market-source registrations (offline only)
        id: feedcheck
        run: node scripts/audit-market-source-catalog.js
      - name: Eleven-workstream release structure preflight (not production approval)
        id: releasecheck
        run: node scripts/v6-release-preflight.js
      - name: Isolated full-server HTTP startup smoke
        id: smokecheck
        run: node tests/full-server-isolated-smoke.js
      - name: Record backend CI evidence in workflow summary
        if: always()
        env:
          NO_OPENAI_RESULT: ${{ steps.noopenai.outcome }}
          ARCHIVE_RESULT: ${{ steps.archivecheck.outcome }}
          SOURCE_RESULT: ${{ steps.sourcecheck.outcome }}
          EIGHT_RESULT: ${{ steps.eightpointcheck.outcome }}
          YELLOW_RESULT: ${{ steps.yellowfourcheck.outcome }}
          FEED_RESULT: ${{ steps.feedcheck.outcome }}
          RELEASE_RESULT: ${{ steps.releasecheck.outcome }}
          SMOKE_RESULT: ${{ steps.smokecheck.outcome }}
        run: |
          {
            echo "## V6 全链回归验收"
            echo ""
            echo "| 门禁 | 结果 |"
            echo "| --- | --- |"
            echo "| OpenAI/ChatGPT 生产 API 依赖禁入 | $NO_OPENAI_RESULT |"
            echo "| 历史完整包接收工具及拒绝边界 | $ARCHIVE_RESULT |"
            echo "| 语法与完整回归 | $SOURCE_RESULT |"
            echo "| 八项一体化证据、风控与网页显示回归 | $EIGHT_RESULT |"
            echo "| 黄色四项：行情/风险送达/研究学习与双端展示 | $YELLOW_RESULT |"
            echo "| 14 数据源离线登记核验 | $FEED_RESULT |"
            echo "| 11 主线发布结构预检 | $RELEASE_RESULT |"
            echo "| 独立服务HTTP启动冒烟 | $SMOKE_RESULT |"
            echo ""
            echo "提交：${GITHUB_SHA}"
            echo ""
            echo "上述均为离线/隔离CI；国内网络、数据授权、真实提醒和生产发布另行验收。"
          } >> "$GITHUB_STEP_SUMMARY"
