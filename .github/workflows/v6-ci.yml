name: V6 CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python ML test dependencies
        run: python -m pip install numpy scikit-learn
      - name: Verify source and run tests
        env:
          V6_MODEL_PYTHON: python
          V6_TEST_CONCURRENCY: '2'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          test -f package.json || { echo 'V6 source not imported yet'; exit 1; }
          npm run check
          npm test
