name: V6 CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: V6_BO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python ML test dependencies
        run: python -m pip install -r tools/requirements-models-optional.txt
      - name: Verify source and run tests
        env:
          V6_MODEL_PYTHON: python
          V6_TEST_CONCURRENCY: '2'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          test -f package.json || { echo 'V6_BO/package.json missing'; exit 1; }
          npm run check
          npm test
      - name: Audit fourteen market-source registrations (offline only)
        run: node scripts/audit-market-source-catalog.js
      - name: Eleven-workstream release structure preflight (not production approval)
        run: node scripts/v6-release-preflight.js
      - name: Isolated full-server HTTP startup smoke
        run: node tests/full-server-isolated-smoke.js
