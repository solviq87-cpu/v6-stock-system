# One-time CI-gated full V6 source ZIP. Binary archives live on an immutable branch, not dev/main.
name: V6 Complete Engineering Bundle
on:
  workflow_run:
    workflows: [V6 CI]
    types: [completed]
    branches: [dev]
concurrency:
  group: v6-complete-engineering-bundle-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'solviq87-cpu/v6-stock-system' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      sha: ${{ steps.gate.outputs.sha }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - name: Gate the precise V6 CI revision and one-time packaging change
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            core.setOutput('approved','false');
            const run=context.payload.workflow_run;
            const sha=run.head_sha;
            const fail=why=>core.info(`完整工程包待验：${why}`);
            if(!/^[a-f0-9]{40}$/.test(sha)||run.status!=='completed'||run.conclusion!=='success'||run.event!=='push'||run.head_branch!=='dev'||run.path!=='.github/workflows/v6-ci.yml'||run.repository.full_name!==context.repo.owner+'/'+context.repo.repo||run.head_repository.full_name!==run.repository.full_name){fail('bad-ci-identity');return;}
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'dev'});
            if(branch.data.commit.sha!==sha){fail('dev-advanced-since-ci');return;}
            const commit=await github.rest.repos.getCommit({owner,repo,ref:sha,per_page:100});
            const trigger=new Set(['V6_BO/scripts/build-complete-engineering-bundle.py','.github/workflows/v6-complete-engineering-bundle.yml','V6_BO/tests/test_complete_engineering_bundle.py']);
            if(!commit.data.files?.some(f=>trigger.has(f.filename))){fail('not-a-bundle-request');return;}
            const response=await github.rest.actions.listJobsForWorkflowRunAttempt({owner,repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
            const jobs=response.data.jobs;
            const names=jobs.map(j=>j.name);
            if(response.data.total_count!==jobs.length||new Set(names).size!==names.length||!['verify','verify-web'].every(n=>names.includes(n))||jobs.some(j=>j.status!=='completed'||j.conclusion!=='success'||j.head_sha!==sha)){fail('required-jobs-unverified');return;}
            if((await github.rest.repos.getBranch({owner,repo,branch:'dev'})).data.commit.sha!==sha){fail('dev-moved-after-ci');return;}
            core.setOutput('sha',sha);
            core.setOutput('approved','true');
      - uses: actions/checkout@v4
        if: steps.gate.outputs.approved == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.approved == 'true'
        with:
          python-version: '3.11'
      - name: Exercise package creation, tampering rejection and private-data guards
        if: steps.gate.outputs.approved == 'true'
        run: python -m unittest discover -s V6_BO/tests -p 'test_complete_engineering_bundle.py' -v
      - name: Build and independently verify full Git source ZIP
        id: package
        if: steps.gate.outputs.approved == 'true'
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v6-bundle"
          filename="V6_FULL_${SOURCE_SHA:0:12}.zip"
          output="$RUNNER_TEMP/v6-bundle/$filename"
          python V6_BO/scripts/build-complete-engineering-bundle.py build --repo "$GITHUB_WORKSPACE" --sha "$SOURCE_SHA" --output "$output" > "$RUNNER_TEMP/v6-bundle/build-result.json"
          python V6_BO/scripts/build-complete-engineering-bundle.py verify --repo "$GITHUB_WORKSPACE" --sha "$SOURCE_SHA" --output "$output" > "$RUNNER_TEMP/v6-bundle/verify-result.json"
          python - "$RUNNER_TEMP/v6-bundle" "$SOURCE_SHA" "$CI_RUN_ID" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1]); sha=sys.argv[2]; run=sys.argv[3]
          build=json.loads((d/'build-result.json').read_text()); verify=json.loads((d/'verify-result.json').read_text())
          if build!=verify or build.get('result')!='verified' or build.get('sourceSha')!=sha: raise SystemExit('source-verification-disagreement')
          z=d/('V6_FULL_'+sha[:12]+'.zip')
          data={'schemaVersion':1,'sourceSha':sha,'filename':z.name,'zipSha256':hashlib.sha256(z.read_bytes()).hexdigest(),'zipBytes':z.stat().st_size,'gitTrackedFiles':verify['gitTrackedFiles'],'sourceBytes':verify['payloadBytes'],'ciUrl':'https://github.com/solviq87-cpu/v6-stock-system/actions/runs/'+run,'scope':'full-Git-tracked-project','productionDeployed':False}
          if data['zipSha256']!=verify['zipSha256']: raise SystemExit('zip-sha-disagreement')
          (d/'VERIFICATION.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (d/'build-result.json').unlink(); (d/'verify-result.json').unlink()
          print(json.dumps(data,sort_keys=True))
          PY
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Preserve ZIP as an Actions artifact before the repository write
        if: steps.gate.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v6-full-${{ steps.gate.outputs.sha }}
          path: ${{ runner.temp }}/v6-bundle/
          if-no-files-found: error
          retention-days: 30
  archive-in-repository:
    needs: build
    if: needs.build.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v6-full-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/complete-v6
      - name: Create a source-SHA-named immutable archive branch
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          ZIP_FILENAME: ${{ needs.build.outputs.filename }}
          BUNDLE_DIR: ${{ runner.temp }}/complete-v6
        with:
          script: |
            const fs=require('fs'),path=require('path'),crypto=require('crypto');
            const {owner,repo}=context.repo;
            const sha=process.env.SOURCE_SHA,filename=process.env.ZIP_FILENAME,base=process.env.BUNDLE_DIR;
            if(!/^[a-f0-9]{40}$/.test(sha)||filename!==`V6_FULL_${sha.slice(0,12)}.zip`)throw Error('invalid-source-identity');
            const receipt=JSON.parse(fs.readFileSync(path.join(base,'VERIFICATION.json'),'utf8'));
            const archive=fs.readFileSync(path.join(base,filename));
            const digest=crypto.createHash('sha256').update(archive).digest('hex');
            if(receipt.sourceSha!==sha||receipt.filename!==filename||receipt.zipSha256!==digest||receipt.zipBytes!==archive.length||receipt.productionDeployed!==false||archive.length>85*1024*1024)throw Error('unverified-or-oversized-archive');
            const branch=`archive/v6-full-${sha.slice(0,12)}`;
            const created=await github.rest.git.createBlob({owner,repo,content:archive.toString('base64'),encoding:'base64'});
            const readme=`# 天枢智策 V6 完整工程包\n\n精确 Git 源码提交：${sha}。包含该提交全部 Git 已跟踪的源代码、电脑/手机页面、研究模块、测试和历史文档；不包含私有运行数据或 .git 历史。\n\nZIP：${filename}\n\nSHA-256：${digest}\n\n必须使用 ZIP 内 ENGINEERING_MANIFEST.json 核对全部文件；本包仅为源码交付，不代表生产部署、真实行情认证或实盘交易开通。\n`;
            const tree=await github.rest.git.createTree({owner,repo,tree:[
              {path:filename,mode:'100644',type:'blob',sha:created.data.sha},
              {path:'VERIFICATION.json',mode:'100644',type:'blob',content:JSON.stringify(receipt,null,2)+'\n'},
              {path:'README.md',mode:'100644',type:'blob',content:readme}
            ]});
            const commit=await github.rest.git.createCommit({owner,repo,message:`archive: complete V6 engineering source ${sha}`,tree:tree.data.sha,parents:[]});
            await github.rest.git.createRef({owner,repo,ref:`refs/heads/${branch}`,sha:commit.data.sha});
            await core.summary.addRaw(`完整工程包已入库：${branch}/${filename}\n\n来源 SHA：${sha}\n\nZIP SHA-256：${digest}\n\n文件数：${receipt.gitTrackedFiles}；验证：全量 Git tree 与每文件双哈希。\n\n静态部署和 Node/Python 生产服务均未在此执行。`).write();
