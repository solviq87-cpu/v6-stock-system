# One-time CI-gated full V6 source ZIP. Binary archives live on an immutable branch, not dev/main.
name: V6 Complete Engineering Bundle
on:
  workflow_run:
    workflows: [V6 CI]
    types: [completed]
    branches: [dev]
concurrency:
  group: v6-complete-engineering-bundle-${{ github.repository_id }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'solviq87-cpu/v6-stock-system' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      sha: ${{ steps.gate.outputs.sha }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - name: Gate the precise V6 CI revision and one-time packaging change
        id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner,repo}=context.repo;
            core.setOutput('approved','false');
            const run=context.payload.workflow_run;
            const sha=run.head_sha;
            const fail=why=>core.info(`完整工程包待验：${why}`);
            if(!/^[a-f0-9]{40}$/.test(sha)||run.status!=='completed'||run.conclusion!=='success'||run.event!=='push'||run.head_branch!=='dev'||run.path!=='.github/workflows/v6-ci.yml'||run.repository.full_name!==context.repo.owner+'/'+context.repo.repo||run.head_repository.full_name!==run.repository.full_name){fail('bad-ci-identity');return;}
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'dev'});
            if(branch.data.commit.sha!==sha){fail('dev-advanced-since-ci');return;}
            const commit=await github.rest.repos.getCommit({owner,repo,ref:sha,per_page:100});
            const trigger=new Set(['V6_BO/scripts/build-complete-engineering-bundle.py','.github/workflows/v6-complete-engineering-bundle.yml','V6_BO/tests/test_complete_engineering_bundle.py']);
            if(!commit.data.files?.some(f=>trigger.has(f.filename))){fail('not-a-bundle-request');return;}
            const response=await github.rest.actions.listJobsForWorkflowRunAttempt({owner,repo,run_id:run.id,attempt_number:run.run_attempt,per_page:100});
            const jobs=response.data.jobs;
            const names=jobs.map(j=>j.name);
            if(response.data.total_count!==jobs.length||new Set(names).size!==names.length||!['verify','verify-web'].every(n=>names.includes(n))||jobs.some(j=>j.status!=='completed'||j.conclusion!=='success'||j.head_sha!==sha)){fail('required-jobs-unverified');return;}
            if((await github.rest.repos.getBranch({owner,repo,branch:'dev'})).data.commit.sha!==sha){fail('dev-moved-after-ci');return;}
            core.setOutput('sha',sha);
            core.setOutput('approved','true');
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.approved == 'true'
        with:
          ref: ${{ steps.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.approved == 'true'
        with:
          python-version: '3.11'
      - name: Exercise package creation, tampering rejection and private-data guards
        if: steps.gate.outputs.approved == 'true'
        run: python -m unittest discover -s V6_BO/tests -p 'test_complete_engineering_bundle.py' -v
      - name: Build and independently verify full Git source ZIP
        id: package
        if: steps.gate.outputs.approved == 'true'
        env:
          SOURCE_SHA: ${{ steps.gate.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v6-bundle"
          filename="V6_FULL_${SOURCE_SHA:0:12}.zip"
          output="$RUNNER_TEMP/v6-bundle/$filename"
          python V6_BO/scripts/build-complete-engineering-bundle.py build --repo "$GITHUB_WORKSPACE" --sha "$SOURCE_SHA" --output "$output" > "$RUNNER_TEMP/v6-bundle/build-result.json"
          python V6_BO/scripts/build-complete-engineering-bundle.py verify --repo "$GITHUB_WORKSPACE" --sha "$SOURCE_SHA" --output "$output" > "$RUNNER_TEMP/v6-bundle/verify-result.json"
          python - "$RUNNER_TEMP/v6-bundle" "$SOURCE_SHA" "$CI_RUN_ID" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          d=Path(sys.argv[1]); sha=sys.argv[2]; run=sys.argv[3]
          build=json.loads((d/'build-result.json').read_text()); verify=json.loads((d/'verify-result.json').read_text())
          if build!=verify or build.get('result')!='verified' or build.get('sourceSha')!=sha: raise SystemExit('source-verification-disagreement')
          z=d/('V6_FULL_'+sha[:12]+'.zip')
          data={'schemaVersion':1,'sourceSha':sha,'filename':z.name,'zipSha256':hashlib.sha256(z.read_bytes()).hexdigest(),'zipBytes':z.stat().st_size,'gitTrackedFiles':verify['gitTrackedFiles'],'sourceBytes':verify['payloadBytes'],'ciUrl':'https://github.com/solviq87-cpu/v6-stock-system/actions/runs/'+run,'scope':'full-Git-tracked-project','productionDeployed':False}
          if data['zipSha256']!=verify['zipSha256']: raise SystemExit('zip-sha-disagreement')
          (d/'VERIFICATION.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (d/'build-result.json').unlink(); (d/'verify-result.json').unlink()
          print(json.dumps(data,sort_keys=True))
          PY
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Preserve ZIP as an Actions artifact before the repository write
        if: steps.gate.outputs.approved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v6-full-${{ steps.gate.outputs.sha }}
          path: ${{ runner.temp }}/v6-bundle/
          if-no-files-found: error
          retention-days: 30
  archive-in-repository:
    needs: build
    if: needs.build.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v6-full-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/complete-v6
      - name: Create a source-SHA-named immutable archive branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          ZIP_FILENAME: ${{ needs.build.outputs.filename }}
          BUNDLE_DIR: ${{ runner.temp }}/complete-v6
        with:
          script: |
            const fs=require('fs'),path=require('path'),crypto=require('crypto');
            const {owner,repo}=context.repo;
            const sha=process.env.SOURCE_SHA,filename=process.env.ZIP_FILENAME,base=process.env.BUNDLE_DIR;
            if(!/^[a-f0-9]{40}$/.test(sha)||filename!==`V6_FULL_${sha.slice(0,12)}.zip`)throw Error('invalid-source-identity');
            const receipt=JSON.parse(fs.readFileSync(path.join(base,'VERIFICATION.json'),'utf8'));
            const archive=fs.readFileSync(path.join(base,filename));
            const digest=crypto.createHash('sha256').update(archive).digest('hex');
            // Retain headroom below GitHub's 100 MB blob/file limit. This cap
            // applies to decoded ZIP bytes; each base64 API request is split below.
            const maxArchiveBytes=90*1024*1024;
            if(receipt.sourceSha!==sha||receipt.filename!==filename||receipt.zipSha256!==digest||receipt.zipBytes!==archive.length||receipt.productionDeployed!==false||archive.length<1||archive.length>maxArchiveBytes)throw Error('unverified-or-oversized-archive');
            async function gitWrite(step,args){
              try{return await github.rest.git[step](args);}
              catch(error){
                const status=Number(error&&error.status);
                throw Error('archive-api-'+step+'-failed-status-'+(Number.isSafeInteger(status)&&status>=100&&status<=599?status:'unknown'));
              }
            }
            const branch=`archive/v6-full-${sha.slice(0,12)}`;
            const partBytes=32*1024*1024;
            const files=[],parts=[];
            for(let offset=0,index=1;offset<archive.length;offset+=partBytes,index++){
              const chunk=archive.subarray(offset,Math.min(offset+partBytes,archive.length));
              const name=archive.length<=partBytes?filename:`${filename}.part${String(index).padStart(3,'0')}`;
              const blobSha=crypto.createHash('sha1').update(Buffer.from(`blob ${chunk.length}\0`)).update(chunk).digest('hex');
              const created=await gitWrite('createBlob',{owner,repo,content:chunk.toString('base64'),encoding:'base64'});
              if(created.data.sha!==blobSha)throw Error('archive-part-blob-disagreement');
              files.push({path:name,mode:'100644',type:'blob',sha:created.data.sha});
              parts.push({path:name,bytes:chunk.length,sha256:crypto.createHash('sha256').update(chunk).digest('hex'),gitBlobSha1:blobSha});
            }
            const split=archive.length>partBytes;
            if(split){
              const manifest={schemaVersion:1,sourceSha:sha,filename,zipBytes:archive.length,zipSha256:digest,partBytes,parts};
              files.push({path:'ARCHIVE_PARTS.json',mode:'100644',type:'blob',content:JSON.stringify(manifest,null,2)+'\n'});
              const restoreScript=String.raw`#!/usr/bin/env python3
            """Reassemble the exact V6 source ZIP from authenticated local archive parts."""
            import hashlib
            import json
            import os
            from pathlib import Path
            import re
            import stat
            import tempfile


            def restore(base):
                base = Path(base).resolve()
                manifest_path = base / "ARCHIVE_PARTS.json"
                if manifest_path.is_symlink() or manifest_path.stat().st_size > 65536:
                    raise ValueError("invalid-parts-manifest")
                manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                sha = manifest.get("sourceSha", "")
                if not isinstance(sha, str) or not re.fullmatch(r"[a-f0-9]{40}", sha):
                    raise ValueError("invalid-source-sha")
                filename = "V6_FULL_" + sha[:12] + ".zip"
                total = manifest.get("zipBytes")
                parts = manifest.get("parts")
                part_bytes = 32 * 1024 * 1024
                if (manifest.get("schemaVersion") != 1 or manifest.get("filename") != filename or
                        type(total) is not int or not part_bytes < total <= 90 * 1024 * 1024 or
                        manifest.get("partBytes") != part_bytes or not isinstance(parts, list) or
                        len(parts) != (total + part_bytes - 1) // part_bytes or
                        not re.fullmatch(r"[a-f0-9]{64}", str(manifest.get("zipSha256", "")))):
                    raise ValueError("invalid-parts-manifest")
                target = base / filename
                if target.exists() or target.is_symlink():
                    raise FileExistsError("output-already-exists")
                descriptor, temporary = tempfile.mkstemp(prefix=filename + ".", suffix=".tmp", dir=base)
                try:
                    whole = hashlib.sha256()
                    written = 0
                    with os.fdopen(descriptor, "wb") as output:
                        for index, item in enumerate(parts):
                            name = filename + ".part" + str(index + 1).zfill(3)
                            expected = min(part_bytes, total - written)
                            if (not isinstance(item, dict) or item.get("path") != name or item.get("bytes") != expected or
                                    not re.fullmatch(r"[a-f0-9]{64}", str(item.get("sha256", ""))) or
                                    not re.fullmatch(r"[a-f0-9]{40}", str(item.get("gitBlobSha1", "")))):
                                raise ValueError("invalid-part-entry")
                            part = base / name
                            if part.is_symlink():
                                raise ValueError("invalid-part-file")
                            handle = os.open(part, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
                            with os.fdopen(handle, "rb") as source:
                                info = os.fstat(source.fileno())
                                if not stat.S_ISREG(info.st_mode) or info.st_size != expected:
                                    raise ValueError("invalid-part-file")
                                digest = hashlib.sha256()
                                blob = hashlib.sha1(b"blob " + str(expected).encode("ascii") + b"\0")
                                copied = 0
                                while True:
                                    chunk = source.read(1024 * 1024)
                                    if not chunk:
                                        break
                                    copied += len(chunk)
                                    if copied > expected:
                                        raise ValueError("part-size-mismatch")
                                    digest.update(chunk)
                                    blob.update(chunk)
                                    whole.update(chunk)
                                    output.write(chunk)
                                if copied != expected or digest.hexdigest() != item["sha256"] or blob.hexdigest() != item["gitBlobSha1"]:
                                    raise ValueError("part-hash-mismatch")
                            written += expected
                        if written != total or whole.hexdigest() != manifest["zipSha256"]:
                            raise ValueError("archive-hash-mismatch")
                        output.flush()
                        os.fsync(output.fileno())
                    # An exclusive link never overwrites a file created during recovery.
                    os.link(temporary, target)
                finally:
                    os.unlink(temporary)
                return target


            if __name__ == "__main__":
                print(restore(Path(__file__).resolve().parent).name + ": verified")`;
              files.push({path:'RESTORE_ARCHIVE.py',mode:'100644',type:'blob',content:restoreScript+'\n'});
            }
            const recovery=split?'完整ZIP按32MiB分片保存；在本目录运行 python3 RESTORE_ARCHIVE.py 自动逐片校验并恢复原ZIP。已有目标文件拒绝覆盖。分片顺序、每片大小/SHA-256/Git blob SHA及原ZIP整体校验值见 ARCHIVE_PARTS.json。':'完整ZIP为单文件。';
            const readme=`# 天枢智策 V6 完整工程包\n\n精确 Git 源码提交：${sha}。包含该提交全部 Git 已跟踪的源代码、电脑/手机页面、研究模块、测试和历史文档；不包含私有运行数据或 .git 历史。\n\nZIP：${filename}\n\n${recovery}\n\nSHA-256：${digest}\n\n必须使用 ZIP 内 ENGINEERING_MANIFEST.json 核对全部文件；本包仅为源码交付，不代表生产部署、真实行情认证或实盘交易开通。\n`;
            const tree=await gitWrite('createTree',{owner,repo,tree:[...files,
              {path:'VERIFICATION.json',mode:'100644',type:'blob',content:JSON.stringify(receipt,null,2)+'\n'},
              {path:'README.md',mode:'100644',type:'blob',content:readme}
            ]});
            const commit=await gitWrite('createCommit',{owner,repo,message:`archive: complete V6 engineering source ${sha}`,tree:tree.data.sha,parents:[]});
            await gitWrite('createRef',{owner,repo,ref:`refs/heads/${branch}`,sha:commit.data.sha});
            const archiveLocation=split?`${branch}/（分片归档；运行 RESTORE_ARCHIVE.py 恢复 ${filename}）`:`${branch}/${filename}`;
            await core.summary.addRaw(`完整工程包已入库：${archiveLocation}\n\n来源 SHA：${sha}\n\nZIP SHA-256：${digest}\n\n文件数：${receipt.gitTrackedFiles}；分片数：${split?parts.length:0}；验证：全量 Git tree 与每文件双哈希。\n\n静态部署和 Node/Python 生产服务均未在此执行。`).write();
