name: V6 Windows first-install package

on:
  pull_request:
    paths:
      - "V6_BO/deploy/windows-host/**"
      - "V6_BO/scripts/build-windows-host-bundle.py"
      - "tests/test_windows_host_bundle.py"
      - ".github/workflows/v6-windows-first-install.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  syntax-windows:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $files = @(
            'V6_BO/deploy/windows-host/INSTALL.ps1',
            'V6_BO/deploy/windows-host/OPEN.ps1',
            'V6_BO/deploy/windows-host/windows-host.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "Parsed: $file"
          }
      - name: Verify installer avoids destructive global operations
        shell: powershell
        run: |
          $source = Get-Content 'V6_BO/deploy/windows-host/INSTALL.ps1' -Raw
          if ($source -match '\b(Set-ExecutionPolicy|wsl\s+--shutdown|git\s+pull)\b') {
            throw 'Installer contains forbidden global/destructive operation'
          }

  bundle-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact-SHA host bundle and incomplete-installer rejection
        run: python3 -m unittest discover -s tests -p 'test_windows_host_bundle.py' -v

  package:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    needs: [syntax-windows, bundle-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Require CI and browser geometry green for this exact dev push SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          url = f'https://api.github.com/repos/{os.environ["REPO"]}/actions/runs?head_sha={sha}&per_page=100'
          req = urllib.request.Request(url, headers={
            'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
            'Accept': 'application/vnd.github+json',
            'User-Agent': 'v6-windows-source-bundle'
          })
          with urllib.request.urlopen(req, timeout=15) as r:
            data = json.load(r)
          assert data.get('total_count', 101) <= 100, 'unbounded CI results'
          valid = [x for x in data.get('workflow_runs', []) if
                   x.get('head_sha') == sha and x.get('event') == 'push' and
                   x.get('head_branch') == 'dev']
          for name in ('V6 CI', 'V6 UI Browser Geometry'):
            runs = [x for x in valid if x.get('name') == name]
            assert runs, f'{name} not found for exact sha'
            newest = max(runs, key=lambda x: (r.get('run_number', 0), r.get('run_attempt', 0)))
            assert newest.get('status') == 'completed' and newest.get('conclusion') == 'success', f'{name} not green'
          print('Verified both exact-head release gates: ' + sha)
          PY
      - name: Build exact tracked revision and record bundle digest
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          out="$RUNNER_TEMP/TianShuV6-Windows-$sha.zip"
          python3 V6_BO/scripts/build-windows-host-bundle.py \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$sha" \
            --output "$out"
          cp "$out" "$GITHUB_WORKSPACE/Windows-First-Install.zip"
          sha256sum Windows-First-Install.zip > Windows-First-Install.zip.sha256
          echo "PACKAGE_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: TianShuV6-Windows-${{ env.PACKAGE_SHA }}
          path: |
            Windows-First-Install.zip
            Windows-First-Install.zip.sha256
          retention-days: 14
          if-no-files-found: error
