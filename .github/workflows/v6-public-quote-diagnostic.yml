name: V6 public quote diagnostic (manual)
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: 'Shanghai/Shenzhen A-share six-digit code'
        required: true
        default: '600519'
        type: string
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: V6_BO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          node -e "if(!/^(60|68|00|30)[0-9]{4}$/.test(process.env.STOCK_CODE||''))process.exit(1)"
      - name: Bounded public-source diagnostic (not realtime certification)
        env:
          STOCK_CODE: ${{ inputs.stock_code }}
        run: |
          mkdir -p /tmp/v6-quote-diagnostic
          node scripts/public-quote-probe.js "$STOCK_CODE" /tmp/v6-quote-diagnostic/result.json tencent,eastmoney,sina
          node - <<'NODE'
          const fs=require('fs');
          const {projectProbe}=require('./src/core/public-quote-probe');
          const p=JSON.parse(fs.readFileSync('/tmp/v6-quote-diagnostic/result.json','utf8'));
          const at=Date.now();
          const view=projectProbe(p,at);
          // Never treat HTTP success, arrival time or two-source agreement as verified real-time.
          const report={mode:'one-shot-diagnostic',checkedAt:new Date(at).toISOString(),
            stockCode:view.code,status:view.status,verifiedLive:false,canTrade:false,
            paidServicesUsed:false,
            sources:view.sources.map(s=>({id:s.id,status:s.status,
              quoteAt:s.quote?.quoteTime||null,
              ageSeconds:s.quote?Math.max(0,Math.round((at-s.quote.quoteAt)/1000)):null}))};
          console.log(JSON.stringify(report,null,2));
          if(process.env.GITHUB_STEP_SUMMARY){
            const rows=report.sources.map(s=>'| '+s.id+' | '+s.status+' | '+
              (s.quoteAt||'未知')+' | '+(s.ageSeconds===null?'未知':s.ageSeconds+'s')+' |');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## V6 免费公开行情一次性探测（非实时报价认证）\\n\\n'+
              '状态：'+report.status+'；检测时点：'+report.checkedAt+'（UTC）\\n\\n'+
              '| 来源 | 读取状态 | 原始报价时点 | 报价年龄 |\\n|---|---|---|---|\\n'+
              rows.join('\\n')+'\\n\\n'+
              'HTTP 200 只表示网页接口可访问；源、交易日历、商业使用许可及飞书送达均未认证。\\n');
          }
          NODE
      - name: Delete diagnostic file
        if: always()
        run: rm -f /tmp/v6-quote-diagnostic/result.json
