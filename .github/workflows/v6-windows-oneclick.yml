name: V6 Windows One-Click Desktop
on:
  pull_request:
    paths:
      - 'V6_BO/deploy/windows-host/**'
      - 'V6_BO/deploy/windows-installer/**'
      - 'V6_BO/tests/windows-native-installer.test.js'
      - 'V6_BO/scripts/build-windows-host-bundle.py'
      - 'V6_BO/tests/windows-desktop-oneclick.test.js'
      - '.github/workflows/v6-windows-oneclick.yml'
  push:
    branches: [dev]
    paths:
      - 'V6_BO/deploy/windows-host/**'
      - 'V6_BO/deploy/windows-installer/**'
      - 'V6_BO/tests/windows-native-installer.test.js'
      - 'V6_BO/scripts/build-windows-host-bundle.py'
      - 'V6_BO/tests/windows-desktop-oneclick.test.js'
      - '.github/workflows/v6-windows-oneclick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-offline-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check one-click safety contracts
        run: node --test V6_BO/tests/windows-desktop-oneclick.test.js V6_BO/tests/windows-native-installer.test.js
      - name: Produce exact-commit offline Windows host bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 V6_BO/scripts/build-windows-host-bundle.py \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip"
          python3 - "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip" <<'PY'
          import hashlib,sys,zipfile
          archive=sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              prefix='tian-shu-windows-host/'
              required={'TianShu-Desktop.ps1','TianShu-Install.ps1','TianShu-Install.cmd',
                        'windows-host.ps1','host-runtime.js','SHA256SUMS.txt','source.json','manifest.json'}
              assert all(prefix+name in names for name in required), 'desktop control missing'
              sums=z.read(prefix+'SHA256SUMS.txt').decode().splitlines()
              listed=set()
              for line in sums:
                  digest,name=line.split('  ',1)
                  assert name not in listed and hashlib.sha256(z.read(prefix+name)).hexdigest()==digest
                  listed.add(name)
              assert names=={prefix+name for name in listed}|{prefix+'SHA256SUMS.txt'}
          print('One-click runtime package: hash, paths and required controllers verified')
          PY
          sha256sum "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip" > "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TianShuV6-Windows-OneClick
          path: |
            ${{ runner.temp }}/TianShuV6-Windows-OneClick.zip
            ${{ runner.temp }}/TianShuV6-Windows-OneClick.zip.sha256
          retention-days: 30
          if-no-files-found: error
  windows-verify:
    needs: build-offline-bundle
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TianShuV6-Windows-OneClick
          path: ${{ runner.temp }}/oneclick
      - name: PowerShell 5.1 parser, complete manifest and read-only probe
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'oneclick/TianShuV6-Windows-OneClick.zip'
          $out = Join-Path $env:RUNNER_TEMP 'oneclick/unpacked'
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          $root = Join-Path $out 'tian-shu-windows-host'
          foreach($name in @('TianShu-Desktop.ps1','TianShu-Install.ps1','TianShu-FirstRun.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ("Invalid PowerShell syntax: " + $name + " " + ($errors | Out-String)) }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-Install.ps1') -Mode Verify
          if ($LASTEXITCODE -ne 0) { throw 'Bundle provenance verification failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-Install.ps1') -Mode StageOnly
          if ($LASTEXITCODE -ne 0) { throw 'Disposable desktop staging failed' }
          $installed = Join-Path $env:LOCALAPPDATA 'TianShuV6/current'
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'TianShu-Desktop.ps1'))) { throw 'Stable launcher missing' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installed 'TianShu-Desktop.ps1') -Mode Probe
          if ($LASTEXITCODE -ne 0) { throw 'Desktop headless probe failed' }

  native-exe:
    name: Compile and safely install real Windows EXE
    needs: [windows-verify]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TianShuV6-Windows-OneClick
          path: ${{ runner.temp }}/native-source
      - name: Verify original source archive and PowerShell first-run wizard
        shell: powershell
        run: |
          $archive=Join-Path $env:RUNNER_TEMP 'native-source/TianShuV6-Windows-OneClick.zip'
          $unpack=Join-Path $env:RUNNER_TEMP 'native-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack
          $root=Join-Path $unpack 'tian-shu-windows-host'
          $info=Get-Content -LiteralPath (Join-Path $root 'source.json') -Raw | ConvertFrom-Json
          $sha=(git rev-parse HEAD).Trim()
          if($info.sourceSha -cne $sha -or $info.controlsSourceSha -cne $sha) { throw 'Git and bundled controller source versions differ' }
          foreach($name in @('TianShu-Install.ps1','TianShu-Desktop.ps1','TianShu-FirstRun.ps1')) {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw ('PowerShell parser error: '+$name+' '+($errors|Out-String)) }
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-FirstRun.ps1') -Mode Probe
          if($LASTEXITCODE -ne 0) { throw 'Installer first-run no-write probe failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-FirstRun.ps1') -Mode Verify
          if($LASTEXITCODE -ne 0) { throw 'Exact runtime checksum verification failed' }
      - name: Compile native Setup EXE with Inno Setup 6
        shell: powershell
        run: |
          $paths=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe','C:\ProgramData\chocolatey\bin\ISCC.exe')
          $tool=@($paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if($tool.Count -eq 0) {
            choco install innosetup --version=6.7.1 --no-progress -y
            if($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed' }
            $tool=@($paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          }
          if($tool.Count -ne 1) { throw 'Inno Setup compiler not found' }
          $source=Join-Path $env:RUNNER_TEMP 'native-runtime/tian-shu-windows-host'
          $output=Join-Path $env:RUNNER_TEMP 'v6-native-output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $script=Join-Path $env:GITHUB_WORKSPACE 'V6_BO\deploy\windows-installer\TianShuV6.iss'
          & $tool[0] "/DSourceRoot=$source" "/O$output" $script
          if($LASTEXITCODE -ne 0) { throw 'Native EXE compiler failed' }
          $exe=Join-Path $output 'TianShuV6-Setup.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'No Windows setup executable produced' }
          $data=[IO.File]::ReadAllBytes($exe)
          if($data.Length -lt 1048576 -or $data[0] -ne 77 -or $data[1] -ne 90) { throw 'Native executable missing MZ header' }
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $output 'TianShuV6-Setup.exe.sha256'),($sha+'  TianShuV6-Setup.exe'+[Environment]::NewLine))
      - name: Test real EXE install and uninstall without touching account data
        shell: powershell
        run: |
          $exe=Join-Path $env:RUNNER_TEMP 'v6-native-output/TianShuV6-Setup.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'V6-Native-Install'
          $private=Join-Path $env:LOCALAPPDATA 'TianShuV6'
          New-Item -ItemType Directory -Path $private -Force | Out-Null
          $marker=Join-Path $private 'KEEP-PRIVATE-ACCOUNT.txt'
          [IO.File]::WriteAllText($marker,'KEEP-EXISTING-LEDGER')
          $process=Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR="+$dest)) -Wait -PassThru
          if($process.ExitCode -ne 0) { throw ('Windows EXE installation failed: '+$process.ExitCode) }
          $runtime=Join-Path $dest 'runtime'
          foreach($name in @('TianShu-FirstRun.ps1','TianShu-Desktop.ps1','TianShu-Install.ps1','SHA256SUMS.txt','source.json','manifest.json')) {
            if(-not (Test-Path -LiteralPath (Join-Path $runtime $name) -PathType Leaf)) { throw ('EXE missing '+$name) }
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $runtime 'TianShu-FirstRun.ps1') -Mode Verify
          if($LASTEXITCODE -ne 0) { throw 'Installed app files failed original SHA256 validation' }
          if([IO.File]::ReadAllText($marker) -cne 'KEEP-EXISTING-LEDGER') { throw 'EXE modified private account directory' }
          $uninstaller=Join-Path $dest 'unins000.exe'
          if(-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'No safe Windows uninstaller' }
          $removed=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($removed.ExitCode -ne 0) { throw 'EXE uninstall failed' }
          if([IO.File]::ReadAllText($marker) -cne 'KEEP-EXISTING-LEDGER') { throw 'Uninstall modified private account directory' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TianShuV6-Native-Setup-EXE
          path: |
            ${{ runner.temp }}/v6-native-output/TianShuV6-Setup.exe
            ${{ runner.temp }}/v6-native-output/TianShuV6-Setup.exe.sha256
          retention-days: 30
          if-no-files-found: error
