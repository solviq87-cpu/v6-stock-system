name: V6 Windows One-Click Desktop
on:
  pull_request:
    paths:
      - 'V6_BO/deploy/windows-host/**'
      - 'V6_BO/scripts/build-windows-host-bundle.py'
      - 'V6_BO/tests/windows-desktop-oneclick.test.js'
      - '.github/workflows/v6-windows-oneclick.yml'
  push:
    branches: [dev]
    paths:
      - 'V6_BO/deploy/windows-host/**'
      - 'V6_BO/scripts/build-windows-host-bundle.py'
      - 'V6_BO/tests/windows-desktop-oneclick.test.js'
      - '.github/workflows/v6-windows-oneclick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-offline-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check one-click safety contracts
        run: node --test V6_BO/tests/windows-desktop-oneclick.test.js
      - name: Produce exact-commit offline Windows host bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 V6_BO/scripts/build-windows-host-bundle.py \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip"
          python3 - "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip" <<'PY'
          import hashlib,sys,zipfile
          archive=sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              prefix='tian-shu-windows-host/'
              required={'TianShu-Desktop.ps1','TianShu-Install.ps1','TianShu-Install.cmd',
                        'windows-host.ps1','host-runtime.js','SHA256SUMS.txt','source.json','manifest.json'}
              assert all(prefix+name in names for name in required), 'desktop control missing'
              sums=z.read(prefix+'SHA256SUMS.txt').decode().splitlines()
              listed=set()
              for line in sums:
                  digest,name=line.split('  ',1)
                  assert name not in listed and hashlib.sha256(z.read(prefix+name)).hexdigest()==digest
                  listed.add(name)
              assert names=={prefix+name for name in listed}|{prefix+'SHA256SUMS.txt'}
          print('One-click runtime package: hash, paths and required controllers verified')
          PY
          sha256sum "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip" > "$RUNNER_TEMP/TianShuV6-Windows-OneClick.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: TianShuV6-Windows-OneClick
          path: |
            ${{ runner.temp }}/TianShuV6-Windows-OneClick.zip
            ${{ runner.temp }}/TianShuV6-Windows-OneClick.zip.sha256
          retention-days: 30
          if-no-files-found: error
  windows-verify:
    needs: build-offline-bundle
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TianShuV6-Windows-OneClick
          path: ${{ runner.temp }}/oneclick
      - name: PowerShell 5.1 parser, complete manifest and read-only probe
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'oneclick/TianShuV6-Windows-OneClick.zip'
          $out = Join-Path $env:RUNNER_TEMP 'oneclick/unpacked'
          Expand-Archive -LiteralPath $zip -DestinationPath $out
          $root = Join-Path $out 'tian-shu-windows-host'
          foreach($name in @('TianShu-Desktop.ps1','TianShu-Install.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ("Invalid PowerShell syntax: " + $name + " " + ($errors | Out-String)) }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-Install.ps1') -Mode Verify
          if ($LASTEXITCODE -ne 0) { throw 'Bundle provenance verification failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'TianShu-Desktop.ps1') -Mode Probe
          if ($LASTEXITCODE -ne 0) { throw 'Desktop headless probe failed' }
